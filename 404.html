<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FormText</title>
    <link rel="icon" type="image/svg+xml" href="/FormText/favicon.svg" />
    <script>
      (function () {
        var path = location.pathname;
        if (path.indexOf("/FormText/") === 0) {
          try {
            sessionStorage.setItem("formtext:redirect", path + location.search + location.hash);
          } catch (error) {}
        }
        location.replace("/FormText/");
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0;url=https://aniglobal.github.io/FormText/" />
    </noscript>
    <style>
      body { font-family: Georgia, "Times New Roman", serif; background: #f6f3ec; color: #1c1b18; display: grid; place-items: center; height: 100vh; margin: 0; }
      main { text-align: center; }
      a { color: #1c1b18; }
    </style>
  </head>
  <body>
    <main>
      <h2>FormText</h2>
      <p>If nothing happens, <a href="https://aniglobal.github.io/FormText/">open FormText here</a>.</p>
    </main>
  </body>
</html>
